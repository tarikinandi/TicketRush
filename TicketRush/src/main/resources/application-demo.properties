# Public demo: no RabbitMQ, tickets are queued in-process (see InMemoryTicketQueue).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
server.tomcat.threads.max=40

ticketrush.demo.enabled=true
ticketrush.demo.reset-minutes=${DEMO_RESET_MINUTES:30}
ticketrush.demo.seed-stock=${DEMO_SEED_STOCK:10}
ticketrush.demo.visitor-ttl-hours=${DEMO_VISITOR_TTL_HOURS:24}

# Cold start on the free instance is CPU bound: create beans on first use instead of all at boot.
# DemoResetService (scheduled job) is @Lazy(false); DataSeeder is a CommandLineRunner and always runs.
spring.main.lazy-initialization=true
spring.datasource.hikari.minimum-idle=1
