# Public demo: no RabbitMQ, tickets are queued in-process (see InMemoryTicketQueue).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
server.tomcat.threads.max=40

ticketrush.demo.reset-minutes=${DEMO_RESET_MINUTES:30}
ticketrush.demo.seed-stock=${DEMO_SEED_STOCK:10}
